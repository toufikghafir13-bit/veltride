name: Next.js storefront checks
on:
  pull_request:
  push:
    branches: [main, "codex/nextjs-storefront-2026-10-09"]
permissions:
  contents: read
jobs:
  storefront:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      STRIPE_CHECKOUT_ENABLED: "false"
      STRIPE_LIVE_APPROVED: "false"
      STRIPE_SECRET_KEY: ""
      VERCEL_ENV: "preview"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-browser-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
